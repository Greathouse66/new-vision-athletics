<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Request a drop-in | New Vision Athletics</title>
  <link rel="icon" href="/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="/styles/portal.css">
  <script type="module" src="/parent/drop-ins.js"></script>
</head>
<body class="portal-parent">
  <main class="card">
    <header class="portal-header">
      <a href="/" class="brand">New Vision Athletics</a>
      <button id="sign-out" type="button" class="secondary" hidden>Sign out</button>
    </header>
    <h1>Request a drop-in</h1>
    <p id="status" role="status" aria-live="polite">Checking your account…</p>
    <p><a href="/parent/index.html">My athletes</a> · <a href="/parent/sessions.html">Confirmed sessions</a></p>
    <div id="family-content" hidden>
      <form id="request-form">
        <label for="athlete">Athlete</label>
        <select id="athlete" required></select>
        <label for="class">Dated class</label>
        <select id="class" required></select>
        <button type="submit">Send request</button>
      </form>
      <p class="note">A request does not hold a place. Wait for coach approval before attending. Only athletes already on your account can be requested here.</p>
      <h2>My requests</h2>
      <ul id="requests"></ul>
      <nav class="portal-mobile-nav" aria-label="Parent shortcuts">
        <a href="/parent/index.html">Athletes</a>
        <a href="/parent/payments.html">Tuition</a>
        <a href="/parent/sessions.html">Sessions</a>
        <a href="/parent/drop-ins.html" aria-current="page">Drop-ins</a>
      </nav>
    </div>
  </main>
</body>
</html>
