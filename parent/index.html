<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>My athletes | New Vision Athletics</title>
  <link rel="icon" href="/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="/styles/portal.css">
  <script type="module" src="/parent/index.js"></script>
</head>
<body>
  <main class="card">
    <header class="portal-header">
      <a href="/" class="brand">New Vision Athletics</a>
      <button id="sign-out" type="button" class="secondary" hidden>Sign out</button>
    </header>
    <h1>My athletes</h1>
    <p id="status" role="status" aria-live="polite">Loading your athletes…</p>
    <section id="invitations-section" hidden>
      <h2>Parent account invitations</h2>
      <ul id="invitations"></ul>
    </section>
    <div id="family-content" hidden>
      <div id="families"></div>
      <p><a href="/parent/payments.html">View my tuition and payments</a></p>
      <p class="note">Upcoming sessions will appear after class schedules are confirmed.</p>
    </div>
  </main>
</body>
</html>
