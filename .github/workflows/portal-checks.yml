name: Portal checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Database access, scheduling, notification and regression checks
        run: node --test --test-concurrency=2 tests/access/*.test.mjs tests/scheduling/*.test.mjs tests/billing/*.test.mjs tests/reports/*.test.mjs tests/import/*.test.mjs
