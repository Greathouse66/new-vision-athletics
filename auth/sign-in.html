<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Parent sign-in | New Vision Athletics</title>
  <link rel="icon" href="/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="/styles/portal.css">
  <script type="module" src="/auth/sign-in.js"></script>
</head>
<body class="portal-auth">
  <main class="card">
    <a href="/" class="brand">New Vision Athletics</a>
    <h1>Parent sign-in</h1>
    <p id="sign-in-intro">Enter the email connected to your family. We’ll send you a sign-in link; there’s no password to remember.</p>
    <form id="sign-in-form" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit" disabled>Email me a sign-in link</button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading sign-in…</p>
  </main>
</body>
</html>
